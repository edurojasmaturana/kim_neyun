name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "app/frontend/**"
      - "app/shared/**" # el Dockerfile del frontend copia shared/ dentro de la imagen
      - ".github/workflows/deploy-frontend.yml"

permissions:
  id-token: write # requerido para autenticar contra AWS vía OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: kim-neyun/frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU (build arm64 en runner amd64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push imagen frontend (arm64)
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE="$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}"
          docker buildx build \
            --platform linux/arm64 \
            -f app/frontend/Dockerfile \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            --push \
            app

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configurar credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ubicar instancia EC2 del frontend
        id: instance
        run: |
          set -euo pipefail
          ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=kim-neyun" \
                      "Name=instance-state-name,Values=running,stopped,stopping" \
            --query 'Reservations[].Instances[0].InstanceId' --output text)
          if [ -z "$ID" ] || [ "$ID" = "None" ]; then
            echo "No se encontró la instancia EC2 del frontend (tag Project=kim-neyun)." >&2
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Encender la instancia si está apagada
        run: |
          set -euo pipefail
          INSTANCE_ID="${{ steps.instance.outputs.id }}"
          STATE=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          if [ "$STATE" != "running" ]; then
            echo "Instancia en estado '$STATE' — encendiendo..."
            aws ec2 start-instances --instance-ids "$INSTANCE_ID"
            aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
            for i in $(seq 1 30); do
              PING=$(aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
                --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || echo "")
              [ "$PING" = "Online" ] && break
              sleep 5
            done
            if [ "$PING" != "Online" ]; then
              echo "El agente SSM no quedó 'Online' a tiempo." >&2
              exit 1
            fi
          fi

      - name: Redeploy del contenedor vía SSM
        run: |
          set -euo pipefail
          INSTANCE_ID="${{ steps.instance.outputs.id }}"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="$ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy frontend ${{ github.sha }}" \
            --parameters "{\"commands\":[
              \"set -euxo pipefail\",
              \"for i in {1..36}; do docker info >/dev/null 2>&1 && break; sleep 5; done\",
              \"docker info >/dev/null 2>&1 || { echo 'Docker no quedo disponible a tiempo (instancia recien encendida / cloud-init en curso)' >&2; exit 1; }\",
              \"aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $REGISTRY\",
              \"docker pull $REGISTRY/${{ env.ECR_REPOSITORY }}:latest\",
              \"for i in {1..36}; do docker inspect frontend >/dev/null 2>&1 && break; sleep 5; done\",
              \"API_BASE_URL=\$(docker inspect frontend --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | grep '^API_BASE_URL=' | cut -d= -f2- || true)\",
              \"if [ -z \\\"\$API_BASE_URL\\\" ]; then echo 'No existe un contenedor frontend previo con API_BASE_URL (deploy inicial o cloud-init no termino); abortando sin tocar el contenedor actual' >&2; exit 1; fi\",
              \"docker rm -f frontend\",
              \"docker run -d --name frontend --restart unless-stopped --network kimnet -e API_BASE_URL=\\\"\$API_BASE_URL\\\" $REGISTRY/${{ env.ECR_REPOSITORY }}:latest\"
            ]}" \
            --query 'Command.CommandId' --output text)

          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
