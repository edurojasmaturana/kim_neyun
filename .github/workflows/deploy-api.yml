name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "app/api/**"
      - "app/shared/**"
      - "app/alembic/**"
      - "app/alembic.ini"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: kim-neyun/api
  LAMBDA_FUNCTION: kim-neyun-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_API_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU (build arm64 en runner amd64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push imagen API (arm64)
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE="$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}"
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            -f app/api/Dockerfile \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            --push \
            app
          echo "image=$IMAGE:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ejecutar migraciones Alembic
        env:
          AURORA_CLUSTER_ARN: ${{ secrets.AURORA_CLUSTER_ARN }}
          AURORA_SECRET_ARN:  ${{ secrets.AURORA_SECRET_ARN }}
          AURORA_DATABASE:    ${{ secrets.AURORA_DATABASE }}
        run: |
          set -euo pipefail
          pip install -q -r app/api/requirements.txt
          # Aurora con min_capacity=0 puede estar auto-paused: reintenta hasta
          # que despierte (DatabaseResumingException) o falle por otra razón.
          for attempt in $(seq 1 15); do
            if (cd app && alembic upgrade head); then
              break
            fi
            if [ "$attempt" -eq 15 ]; then
              echo "Alembic falló tras 15 intentos" >&2
              exit 1
            fi
            echo "Aurora resumiendo (intento $attempt/15), esperando 15s..."
            sleep 15
          done

      - name: Actualizar Lambda con la nueva imagen
        run: |
          set -euo pipefail
          aws lambda update-function-code \
            --function-name "${{ env.LAMBDA_FUNCTION }}" \
            --image-uri "${{ steps.build.outputs.image }}"
          aws lambda wait function-updated \
            --function-name "${{ env.LAMBDA_FUNCTION }}"
          echo "Lambda actualizado. Estado final:"
          aws lambda get-function-configuration \
            --function-name "${{ env.LAMBDA_FUNCTION }}" \
            --query '[LastUpdateStatus,State]'
