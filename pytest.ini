[pytest]
# El paquete raíz del backend es app/ (los módulos se importan como
# `shared.*` y `api.*`), por eso se añade app/ al pythonpath.
pythonpath = app
testpaths = app/tests
addopts = -q --cov=app/shared --cov=app/api --cov-report=term-missing
filterwarnings =
    # passlib inspecciona bcrypt.__about__ (eliminado en bcrypt 4.1+); inofensivo.
    ignore::DeprecationWarning
