# Configuración de Alembic para la base de usuarios.
# La URL/engine NO se define aquí: env.py construye el engine vía
# shared.users_db.get_engine() para servir tanto a Postgres local (psycopg2) como
# a Aurora Serverless v2 por Data API, sin duplicar configuración.
#
# Uso (desde la carpeta app/):
#   alembic upgrade head        # aplica migraciones
#   alembic revision -m "..."   # crea una nueva revisión

[alembic]
script_location = alembic
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
